name: DevSecOps Pipeline
on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed


permissions:
  contents: read
  security-events: write
  actions: read

 
jobs:
  # 🔐 SAST - CodeQL
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL
        uses: github/codeql-action/analyze@v3

  # 📦 Dependency Scan
  dependency-scan:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Node audit
        run: |
          cd services/user-service && npm audit || true
          cd ../order-service && npm audit || true

      - name: Python audit
        run: |
          pip install pip-audit
          cd services/product-service && pip-audit || true

  # 🐳 Container Scan
  container-scan:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

    # 🔧 STEP 1: Set Image Tag
      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" | cut -c1-7 >> $GITHUB_ENV
    # 🔐 STEP 2: AWS Login (ADD HERE)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
# 🔍 STEP 3: TRIVY SCANS (ADD HERE)

      - name: Scan User Service Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/user-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
      - name: Scan Product Service Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/product-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL

      - name: Scan Order Service Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/order-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL

  # 🏗 Terraform Scan
  terraform-scan:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: checkov -d ./terraform || true
